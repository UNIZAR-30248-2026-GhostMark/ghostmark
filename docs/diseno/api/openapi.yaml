openapi: 3.1.0
info:
  title: GhostMark API
  version: 0.1.0
  description: |
    Contrato de la API del servidor de GhostMark. Se escribe antes que el código y manda:
    servidor y app se programan contra él (ver docs/diseno/convenciones-modelo-datos.md).
    Errores en application/problem+json con el campo `codigo`.
servers:
  - url: http://localhost:8080
    description: Local (Docker Compose)
tags:
  - name: cuenta
    description: Cuenta del jugador (PBI 1, #2)
  - name: sesion
    description: Inicio y cierre de sesión (PBI 1, #2)
  - name: partida
    description: Crear, configurar y compartir una partida (PBI 2, #3)
  - name: inscripcion
    description: Inscribirse en una partida (PBI 3, #4)
  - name: misiones
    description: |
      Misiones generadas con IA y aprobadas por el máster (PBI 6a, #6), y biblioteca si la IA falla (PBI 6b, #190).
      Solo el máster, con la partida en inscripción y `tipoMisiones = IA`.
  - name: juego
    description: |
      Arrancar la partida y ver mi objetivo y mi misión (PBI 4, #5, y PBI 5, #31).
      A la hora de inicio la partida arranca sola si tiene 3 o más jugadores, o se cancela si tiene menos
      (`motivoCancelacion` `POCOS_JUGADORES`); no hay ruta para eso: el servidor lo revisa cada minuto
      y antes de atender cada petición.
      Código de vida, eliminación, herencia y feed (PBI 7a, #7), y códigos rechazados y bloqueo (PBI 7b, #189).
      Cierre de la partida y resultado (PBI 8, #8): la partida se cierra sola al quedar un único vivo o al llegar
      la fecha de fin (revisado cada minuto y antes de atender cada petición), o cuando la cierra el máster.
      Horarios seguros (PBI 9, #9): nadie elimina ni es eliminado en su horario lectivo.
  - name: zonas
    description: |
      Zonas seguras de la partida (PBI 10a, #10) y resultado de zona al eliminar (PBI 10b, #272).
      La posición del jugador no sale del móvil: el servidor solo recibe `DENTRO`, `FUERA` o `NO_CONCLUYENTE`.
  - name: disputas
    description: |
      Abrir, responder y arbitrar una disputa (PBI 11a, #11) y anular una eliminación (PBI 11b, #273).
      La víctima disputa su eliminación en los 10 minutos siguientes; el cazador abre una disputa por negativa
      a enseñar el código, hasta el cierre. Las disputas solo las ven los implicados y el árbitro.
security:
  - bearerAuth: []
paths:
  /api/v1/cuentas:
    post:
      tags: [cuenta]
      operationId: crearCuenta
      summary: Crear la cuenta e iniciar sesión
      description: Crea la cuenta con alias, email y contraseña y devuelve una sesión abierta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaCuenta' }
            example: { alias: imad_h, email: imad@example.com, contrasena: fantasma2026 }
      responses:
        '201':
          description: Cuenta creada y sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '409':
          description: El alias (`ALIAS_OCUPADO`) o el email (`EMAIL_OCUPADO`) ya están en uso
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { type: about:blank, title: Conflict, status: 409, codigo: ALIAS_OCUPADO, detail: Ese alias ya está en uso }
  /api/v1/sesiones:
    post:
      tags: [sesion]
      operationId: iniciarSesion
      summary: Iniciar sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
      responses:
        '200':
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401':
          description: Email o contraseña incorrectos (`CREDENCIALES_INCORRECTAS`). No se dice cuál de los dos falla.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/sesiones/refresco:
    post:
      tags: [sesion]
      operationId: refrescarSesion
      summary: Obtener tokens nuevos con el token de refresco
      description: El token de refresco usado deja de valer y se devuelve otro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRefresco' }
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/TokenNoValido' }
  /api/v1/sesiones/cierre:
    post:
      tags: [sesion]
      operationId: cerrarSesion
      summary: Cerrar sesión en este móvil
      description: Revoca el token de refresco indicado si es de la cuenta autenticada. Si no lo es o no existe, responde 204 sin revocar nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRefresco' }
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/cuentas/yo:
    delete:
      tags: [cuenta]
      operationId: borrarMiCuenta
      summary: Borrar mi cuenta y todos sus datos
      description: |
        Borrado físico de la cuenta, su horario y sus sesiones. En los eventos de partidas en curso
        el jugador pasa a «cuenta eliminada». Después ya no se puede iniciar sesión y el alias queda libre.
        Si es máster, sus partidas en inscripción se cancelan y las que están en juego siguen sin máster.
      responses:
        '204': { description: Cuenta borrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/cuentas/yo/aceptaciones:
    put:
      tags: [cuenta]
      operationId: aceptarAvisos
      summary: Aceptar el permiso de ubicación y el aviso de disponibilidad
      description: |
        Se acepta una sola vez, al crear la cuenta. Repetir la llamada no cambia la fecha de la primera
        aceptación. Solo admite `true`: no se puede retirar desde aquí.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Aceptaciones' }
      responses:
        '200':
          description: Aceptaciones guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/cuentas/yo/horario:
    get:
      tags: [cuenta]
      operationId: obtenerMiHorario
      summary: Mi horario lectivo
      responses:
        '200':
          description: Franjas marcadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    put:
      tags: [cuenta]
      operationId: guardarMiHorario
      summary: Guardar mi horario lectivo
      description: Sustituye el horario entero por las franjas enviadas. Una lista vacía deja la cuenta sin horas de clase.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Horario' }
            example: { franjas: [ { dia: 1, horaInicio: '08:00' }, { dia: 1, horaInicio: '08:30' }, { dia: 3, horaInicio: '15:00' } ] }
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/partidas:
    post:
      tags: [partida]
      operationId: crearPartida
      summary: Crear una partida
      description: |
        Quien la crea es el máster. Se guarda el evento PARTIDA_CREADA y se genera el código de invitación.
        El inicio tiene que estar al menos 15 min en el futuro y el fin, después del inicio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracionPartida' }
            example: { nombre: Killer Bienvenida EINA, inicioEn: '2026-10-20T08:00:00Z', finEn: '2026-10-27T20:00:00Z', tipoMisiones: BIBLIOTECA, plazoDisputaHoras: 6, entradasTardias: false, masterJuega: true }
      responses:
        '201':
          description: Partida creada, con su código y su enlace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partida' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/cuentas/yo/partidas:
    get:
      tags: [partida]
      operationId: listarMisPartidas
      summary: Mis partidas (pestaña «Partidas»)
      description: Las partidas en las que soy máster o estoy inscrito, de cualquier estado.
      responses:
        '200':
          description: Lista de partidas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartidaResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /api/v1/partidas/{partidaId}:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [partida]
      operationId: obtenerPartida
      summary: Ver una partida
      description: |
        El máster recibe la configuración completa con el código y el enlace (`Partida`).
        Un inscrito recibe el resumen (`PartidaResumen`). A cualquier otro se le responde 404.
      responses:
        '200':
          description: La partida
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Partida'
                  - $ref: '#/components/schemas/PartidaResumen'
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
    patch:
      tags: [partida]
      operationId: editarPartida
      summary: Cambiar la configuración (solo el máster, antes del arranque)
      description: |
        Se envían solo los campos que cambian. Mismas reglas que al crearla.
        Si cambia `masterJuega`, se crea la inscripción del máster con el horario de su cuenta
        (`JUGADOR_INSCRITO`) o se borra (`INSCRIPCION_RETIRADA`, motivo `MASTER_NO_JUEGA`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambiosPartida' }
      responses:
        '200':
          description: Configuración guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partida' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida ya no está en inscripción (`PARTIDA_NO_EDITABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/codigo/{codigo}:
    get:
      tags: [partida]
      operationId: obtenerPartidaPorCodigo
      summary: Ver una partida por su código (al abrir el enlace o escanear el QR)
      description: Cualquier jugador con sesión ve los datos públicos, para decidir si se une (PBI 3).
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CodigoInvitacion' }
      responses:
        '200':
          description: Datos públicos de la partida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidaPublica' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
  /api/v1/inscripciones:
    post:
      tags: [inscripcion]
      operationId: inscribirse
      summary: Inscribirme en una partida con su código
      description: |
        Solo con las normas aceptadas. Copia el horario lectivo de mi cuenta a esta partida.
        Solo en partidas en inscripción; un máster que no juega no puede inscribirse.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaInscripcion' }
            example: { codigo: K7PX4MQ2, aceptaNormas: true }
      responses:
        '201':
          description: Inscrito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inscripcion' }
        '400':
          description: Faltan datos o no se aceptan las normas (`NORMAS_NO_ACEPTADAS`, `DATOS_NO_VALIDOS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: Ya estoy inscrito (`YA_INSCRITO`), soy el máster y no juego (`ES_MASTER`) o la partida ya no admite inscripciones (`PARTIDA_NO_ABIERTA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/inscritos:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [inscripcion]
      operationId: listarInscritos
      summary: Lista de inscritos (sala de espera y lista del máster)
      description: La ven el máster y los inscritos. A cualquier otro se le responde 404.
      responses:
        '200':
          description: Inscritos, por orden de inscripción
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Inscrito' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
  /api/v1/partidas/{partidaId}/yo/horario:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [inscripcion]
      operationId: obtenerMiHorarioEnPartida
      summary: Mi horario lectivo en esta partida
      description: A quien no está inscrito, incluido el máster que no juega, se le responde 404.
      responses:
        '200':
          description: Franjas marcadas en esta partida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
    put:
      tags: [inscripcion]
      operationId: guardarMiHorarioEnPartida
      summary: Cambiar mi horario en esta partida («Revisar mi horario»)
      description: |
        Solo hasta el arranque. No cambia el horario de la cuenta ni el de otras partidas.
        A quien no está inscrito, incluido el máster que no juega, se le responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Horario' }
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Horario' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida ya ha arrancado y el horario está congelado (`PARTIDA_NO_EDITABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/zonas:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [zonas]
      operationId: obtenerZonas
      summary: Zonas seguras de la partida
      description: |
        Para el máster (juegue o no) y los inscritos, en cualquier estado de la partida. Otra cuenta recibe 404.
        Son las coordenadas del dibujo del máster; la API no da ni guarda nunca la posición de nadie.
      responses:
        '200':
          description: Zonas seguras (lista vacía si no hay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zonas' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
    put:
      tags: [zonas]
      operationId: guardarZonas
      summary: Crear, modificar y borrar las zonas seguras
      description: |
        Sustituye la lista entera: las zonas que no vienen se borran, las que traen `id` se modifican y las
        demás se crean. Solo el máster, juegue o no, y con la partida en inscripción: al arrancar se congelan.
        Hasta 10 zonas; cada una con un nombre de 1 a 30 caracteres, distinto en la partida sin distinguir
        mayúsculas, y de 3 a 20 puntos sin repetir ni lados que se crucen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Zonas' }
      responses:
        '200':
          description: Zonas guardadas, con el `id` de las nuevas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zonas' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida ya no está en inscripción y las zonas están congeladas (`PARTIDA_NO_EDITABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/misiones-ia:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [misiones]
      operationId: listarMisionesIa
      summary: Misiones de la IA de la partida y tandas que quedan
      responses:
        '200':
          description: Las misiones generadas para la partida, con su estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisionesIa' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
  /api/v1/partidas/{partidaId}/misiones-ia/tandas:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    post:
      tags: [misiones]
      operationId: pedirTandaMisionesIa
      summary: Pedir una tanda de misiones a la IA
      description: |
        Pide 12 misiones al generador con el contexto y entrega hasta 8 que pasen la validación de formato y el
        filtro de categorías prohibidas, en estado `PROPUESTA`. Como mucho 5 tandas por partida, contadas con los
        eventos `MISIONES_GENERADAS` y no con las misiones guardadas: una tanda en la que se descartan las 12 cuenta
        igual. Una tanda que falla porque la IA no está disponible (503) no registra el evento y no cuenta;
        `tandasRestantes` es 5 menos las tandas contadas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaTanda' }
      responses:
        '201':
          description: Tanda generada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TandaMisiones' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: |
            La partida ya no está en inscripción (`PARTIDA_NO_ABIERTA`), no tiene `tipoMisiones = IA`
            (`MISIONES_DE_BIBLIOTECA`) o ya ha pedido 5 tandas (`LIMITE_TANDAS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: La IA falla, no responde en 15 s o no queda cuota (`IA_NO_DISPONIBLE`); la tanda no cuenta y la partida seguirá con la biblioteca
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/misiones-ia/{misionId}:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
      - name: misionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [misiones]
      operationId: revisarMisionIa
      summary: Aprobar o rechazar una misión de la IA
      description: La decisión es definitiva; solo se puede revisar una misión `PROPUESTA`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionMision' }
      responses:
        '200':
          description: Misión revisada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisionIa' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida ya no está en inscripción (`PARTIDA_NO_ABIERTA`) o la misión ya está revisada (`MISION_YA_REVISADA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/arranque:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    post:
      tags: [juego]
      operationId: arrancarYa
      summary: «Arrancar ya» (solo el máster, con 3 o más jugadores)
      description: Forma el ciclo de objetivos, reparte las misiones y congela los horarios.
      responses:
        '200':
          description: Partida en juego
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidaResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: Hay menos de 3 jugadores (`POCOS_JUGADORES`) o la partida ya no está en inscripción (`PARTIDA_NO_ABIERTA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/yo/carta:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [juego]
      operationId: obtenerMiCarta
      summary: Mi objetivo y mi misión
      description: |
        Solo los del jugador que llama. Nadie obtiene los de otro, tampoco el máster:
        si no juega no tiene carta y recibe 404. Tras una eliminación devuelve el objetivo y la misión
        heredados; si el jugador está eliminado, `estado = ELIMINADO` sin objetivo ni misión.
        Si el jugador o su objetivo están en su horario lectivo, `noDisponible` dice quién y hasta cuándo.
      responses:
        '200':
          description: Mi carta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida no está en juego, porque aún no ha arrancado o ya se ha cerrado (`PARTIDA_NO_EN_JUEGO`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/cierre:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    post:
      tags: [juego]
      operationId: cerrarPartida
      summary: «Cerrar partida» (solo el máster, con la partida en juego)
      description: |
        Cierra la partida con el mismo resultado que en la fecha de fin: entre los vivos, gana quien más
        eliminaciones tiene, un empate en cabeza es empate de partida y, si solo queda uno, es el último superviviente.
        Ninguna vía cierra mientras quede algo por disputar: con el último superviviente o la fecha de fin, la
        partida se cierra sola en cuanto no queda nada pendiente.
      responses:
        '200':
          description: Partida cerrada, con su resultado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidaResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoEsMaster' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: |
            La partida no está en juego (`PARTIDA_NO_EN_JUEGO`), también si ya se ha cerrado por otra vía, o tiene
            una disputa abierta o una eliminación de hace menos de 10 minutos que aún se puede disputar
            (`DISPUTAS_PENDIENTES`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/yo/codigo:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [juego]
      operationId: obtenerMiCodigo
      summary: Mi código de vida
      description: |
        Código de 6 dígitos del paso de 60 s actual (TOTP con el secreto del jugador) y el instante en que
        caduca. La app lo vuelve a pedir al llegar a `caducaEn`. Solo para el propio jugador y vivo:
        nadie obtiene el código de otro.
      responses:
        '200':
          description: Mi código actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoVida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida no está en juego (`PARTIDA_NO_EN_JUEGO`) o el jugador está eliminado (`JUGADOR_ELIMINADO`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/eliminaciones:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    post:
      tags: [juego]
      operationId: eliminar
      summary: Eliminar a mi objetivo con su código de vida
      description: |
        La víctima es siempre el objetivo actual de quien llama. Se acepta el código del paso actual y,
        durante los 15 primeros segundos de cada paso, el del anterior. Si coincide, la víctima queda
        eliminada y quien llama hereda su objetivo y su misión y suma una eliminación. Tres códigos
        incorrectos seguidos bloquean los intentos hasta que rota el código; un código sin 6 dígitos responde 400
        y no cuenta como fallo. Las eliminaciones de una
        partida se aplican de una en una: si dos coinciden en la cadena, vale la primera.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaEliminacion' }
      responses:
        '200':
          description: Eliminación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eliminacion' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: |
            La partida no está en juego (`PARTIDA_NO_EN_JUEGO`), quien llama ya está eliminado
            (`JUGADOR_ELIMINADO`, también cuando otra eliminación de la cadena llegó antes), tiene los
            intentos bloqueados (`INTENTOS_BLOQUEADOS`, con `bloqueadoHasta`), él o su objetivo están en
            su horario lectivo (`HORARIO_LECTIVO`, con `motivo` y `disponibleEn`) o tiene abierta una disputa
            sobre una eliminación suya (`DISPUTA_ABIERTA`). Un rechazo por horario o por disputa no compara el
            código ni gasta intentos. Desde la fecha de fin no se puede eliminar (`PARTIDA_NO_EN_JUEGO`), aunque
            la partida espere a sus disputas para cerrarse.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                bloqueado: { value: { type: about:blank, title: Conflict, status: 409, codigo: INTENTOS_BLOQUEADOS, bloqueadoHasta: '2026-11-05T17:31:00Z' } }
                horario: { value: { type: about:blank, title: Conflict, status: 409, codigo: HORARIO_LECTIVO, motivo: OBJETIVO, disponibleEn: '2026-11-17T10:30:00Z' } }
        '422':
          description: |
            El código no es el de su objetivo: `CODIGO_CADUCADO` si es uno suyo de los últimos 10 minutos,
            `CODIGO_INCORRECTO` en cualquier otro caso (también si es el de otro jugador). Lleva
            `intentosRestantes`; el tercer fallo seguido responde 409 `INTENTOS_BLOQUEADOS`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { type: about:blank, title: Unprocessable Entity, status: 422, codigo: CODIGO_INCORRECTO, intentosRestantes: 2 }
  /api/v1/partidas/{partidaId}/feed:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [juego]
      operationId: obtenerFeed
      summary: Feed de la partida
      description: |
        Las eliminaciones y las anulaciones, de la más reciente a la más antigua, sin decir quién eliminó a quién.
        Las disputas no salen en el feed.
        Lo ven el máster, juegue o no, y todos los jugadores, vivos o eliminados.
      responses:
        '200':
          description: Entradas del feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntradaFeed' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: La partida no está en juego ni cerrada (`PARTIDA_NO_EN_JUEGO`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/disputas:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
    get:
      tags: [disputas]
      operationId: listarDisputas
      summary: Las disputas en las que soy implicado o árbitro
      description: |
        De la más reciente a la más antigua. Solo las que tienen a quien llama como cazador, víctima o árbitro
        actual; el máster solo ve las que arbitra. El resultado de zona solo se devuelve al árbitro.
      responses:
        '200':
          description: Mis disputas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Disputa' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
    post:
      tags: [disputas]
      operationId: abrirDisputa
      summary: Abrir una disputa
      description: |
        `ELIMINACION`: la víctima disputa su eliminación, en los 10 minutos siguientes y una sola vez. Si la
        eliminación se guardó con resultado de zona `DENTRO`, la disputa se resuelve sola a favor de la víctima y la
        eliminación se anula. `NEGATIVA`: el cazador disputa que su objetivo no le enseña el código; no tiene
        límite de 10 minutos, pero no se puede abrir desde la fecha de fin. Arbitra el máster, salvo que esté
        implicado o haya borrado su cuenta: entonces se sortea un jugador no implicado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaDisputa' }
      responses:
        '201':
          description: Disputa abierta (o ya resuelta por la zona)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disputa' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: |
            La partida no está en juego, o ya ha pasado la fecha de fin en `NEGATIVA` (`PARTIDA_NO_EN_JUEGO`).
            En `ELIMINACION`: quien llama no tiene una eliminación que disputar, porque está vivo, ya la ha disputado
            o fue eliminado por una disputa (`ELIMINACION_NO_DISPUTABLE`), o han pasado los 10 minutos
            (`PLAZO_DISPUTA_VENCIDO`). En `NEGATIVA`: quien llama está eliminado o no tiene objetivo
            (`JUGADOR_ELIMINADO`) o ya tiene una disputa por negativa abierta (`DISPUTA_YA_ABIERTA`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/disputas/{disputaId}:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
      - $ref: '#/components/parameters/DisputaId'
    get:
      tags: [disputas]
      operationId: obtenerDisputa
      summary: Una disputa (pantalla `h-disputa`)
      description: Solo para los dos implicados y el árbitro actual; los demás reciben 404.
      responses:
        '200':
          description: La disputa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disputa' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
  /api/v1/partidas/{partidaId}/disputas/{disputaId}/respuesta:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
      - $ref: '#/components/parameters/DisputaId'
    post:
      tags: [disputas]
      operationId: responderDisputa
      summary: Responder a una disputa (el otro implicado, una vez)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextoDisputa' }
      responses:
        '200':
          description: Disputa con la respuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disputa' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Quien llama abrió la disputa o es el árbitro (`NO_PUEDE_RESPONDER`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: Ya está resuelta o sin objeto (`DISPUTA_NO_ABIERTA`) o ya se respondió (`YA_RESPONDIDA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/partidas/{partidaId}/disputas/{disputaId}/decision:
    parameters:
      - $ref: '#/components/parameters/PartidaId'
      - $ref: '#/components/parameters/DisputaId'
    post:
      tags: [disputas]
      operationId: decidirDisputa
      summary: Decidir una disputa (solo el árbitro actual)
      description: |
        `VICTIMA` en `ELIMINACION` anula la eliminación y las que el mismo cazador hizo después; `CAZADOR` la confirma.
        `CAZADOR` en `NEGATIVA` elimina a la víctima como si hubiera dado el código (sin resultado de zona ni disputa
        posterior); `VICTIMA` no cambia nada. Se puede decidir sin esperar la respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDisputa' }
      responses:
        '200':
          description: Disputa resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disputa' }
        '400': { $ref: '#/components/responses/DatosNoValidos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Quien llama es implicado pero no el árbitro (`NO_ES_ARBITRO`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NoEncontrada' }
        '409':
          description: Ya está resuelta o sin objeto (`DISPUTA_NO_ABIERTA`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso de 15 minutos.
  parameters:
    PartidaId:
      name: partidaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DisputaId:
      name: disputaId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    DatosNoValidos:
      description: Algún campo no cumple sus reglas (`DATOS_NO_VALIDOS`); `errores` dice cuáles.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { type: about:blank, title: Bad Request, status: 400, codigo: DATOS_NO_VALIDOS, errores: [ { campo: contrasena, mensaje: Debe tener al menos 8 caracteres } ] }
    NoAutenticado:
      description: Falta el token de acceso o no vale (`NO_AUTENTICADO`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    TokenNoValido:
      description: El token de refresco no existe, ha caducado o ya se usó (`TOKEN_NO_VALIDO`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrada:
      description: No existe o no tienes acceso (`NO_ENCONTRADA`). No se distingue entre los dos casos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEsMaster:
      description: Solo el máster puede hacerlo (`NO_ES_MASTER`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Carta:
      type: object
      required: [estado, aliasObjetivo, mision, eliminaciones, intentosRestantes, bloqueadoHasta, noDisponible, bloqueadoPorDisputa, disputarHasta]
      properties:
        estado: { type: string, enum: [VIVO, ELIMINADO] }
        aliasObjetivo: { type: [string, 'null'], description: 'Nulo si el objetivo borró su cuenta («cuenta eliminada»), si el jugador está eliminado o si es el único vivo' }
        mision: { type: [string, 'null'], example: Que te diga la palabra «compilador», description: Nula si el jugador está eliminado o es el único vivo }
        eliminaciones: { type: integer, minimum: 0 }
        intentosRestantes:
          type: [integer, 'null']
          minimum: 1
          maximum: 3
          description: >-
            Códigos que puede probar antes del bloqueo (3, 2 o 1). Durante un bloqueo vale 3, los que tendrá cuando
            rote el código. Nulo si el jugador está eliminado o es el único vivo
        bloqueadoHasta:
          type: [string, 'null']
          format: date-time
          description: Tras 3 fallos seguidos, hasta cuándo no puede eliminar (el inicio del paso siguiente del código); nulo si no está bloqueado
        noDisponible:
          oneOf:
            - $ref: '#/components/schemas/NoDisponible'
            - type: 'null'
          description: Nulo si puede eliminar a su objetivo ahora, si está eliminado o si es el único vivo
        bloqueadoPorDisputa:
          type: boolean
          description: Verdadero mientras tiene abierta una disputa sobre una eliminación suya; «Eliminar» sale desactivado
        disputarHasta:
          type: [string, 'null']
          format: date-time
          description: >-
            Solo con el jugador eliminado: hasta cuándo puede disputar su eliminación (10 minutos desde ella). Nulo si ya
            ha vencido, si ya la ha disputado, si la eliminación fue por una disputa o si el jugador está vivo
    NoDisponible:
      type: object
      description: >-
        El jugador o su objetivo están en su horario lectivo. Solo dice quién y hasta cuándo: nunca el horario.
        El estado cambia solo en punto o a y media.
      required: [motivo, disponibleEn]
      properties:
        motivo: { type: string, enum: [CAZADOR, OBJETIVO], description: '`CAZADOR` si quien llama está en clase (aunque también lo esté su objetivo); `OBJETIVO` si solo lo está su objetivo' }
        disponibleEn: { type: string, format: date-time, description: Primer instante en punto o a y media en que ninguno de los dos está en clase }
    MisionIa:
      type: object
      required: [id, texto, estado, tanda]
      properties:
        id: { type: string, format: uuid }
        texto: { type: string, minLength: 10, maxLength: 200, example: Que te diga qué asignatura le cuesta más }
        estado: { type: string, enum: [PROPUESTA, APROBADA, RECHAZADA] }
        tanda: { type: integer, minimum: 1, maximum: 5 }
    MisionesIa:
      type: object
      required: [misiones, tandasRestantes]
      properties:
        misiones: { type: array, items: { $ref: '#/components/schemas/MisionIa' } }
        tandasRestantes: { type: integer, minimum: 0, maximum: 5 }
    NuevaTanda:
      type: object
      required: [contexto]
      properties:
        contexto: { type: string, minLength: 3, maxLength: 40, example: Campus, description: Uno de los chips o el texto libre de «Otro…» }
    TandaMisiones:
      type: object
      required: [tanda, misiones, descartadas, tandasRestantes]
      properties:
        tanda: { type: integer, minimum: 1, maximum: 5 }
        misiones: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/MisionIa' } }
        descartadas: { type: integer, minimum: 0, description: Las que quitaron la validación de formato y el filtro de categorías prohibidas }
        tandasRestantes: { type: integer, minimum: 0, maximum: 4 }
    RevisionMision:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [APROBADA, RECHAZADA] }
    CodigoVida:
      type: object
      required: [codigo, caducaEn]
      properties:
        codigo: { type: string, pattern: '^[0-9]{6}$', example: '482913' }
        caducaEn: { type: string, format: date-time, description: Final del paso de 60 s actual }
    NuevaEliminacion:
      type: object
      required: [codigo, resultadoZona]
      additionalProperties: false
      description: Cualquier otro campo, como una coordenada, responde 400 `DATOS_NO_VALIDOS`
      properties:
        codigo: { type: string, pattern: '^[0-9]{6}$', example: '482913' }
        resultadoZona:
          type: string
          enum: [DENTRO, FUERA, NO_CONCLUYENTE]
          description: >-
            Lo calcula el móvil del cazador con su posición y su precisión, que no envía. `FUERA` también si la partida
            no tiene zonas. Se guarda con la eliminación y solo se mira si hay disputa (PBI 11a)
    Punto:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 41.6836 }
        lon: { type: number, minimum: -180, maximum: 180, example: -0.8889 }
    Zona:
      type: object
      required: [nombre, puntos]
      properties:
        id: { type: string, format: uuid, description: 'Al guardar: sin `id` se crea; con `id`, se modifica esa zona' }
        nombre: { type: string, minLength: 1, maxLength: 30, example: Biblioteca }
        puntos:
          type: array
          minItems: 3
          maxItems: 20
          description: Vértices del polígono en orden, sin repetir el primero al final
          items: { $ref: '#/components/schemas/Punto' }
    Zonas:
      type: object
      required: [zonas]
      properties:
        zonas:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Zona' }
    Eliminacion:
      type: object
      required: [aliasVictima, carta]
      properties:
        aliasVictima: { type: [string, 'null'], description: Nulo si la víctima borró su cuenta }
        carta: { $ref: '#/components/schemas/Carta' }
    DisputasPorArbitrar:
      type: integer
      minimum: 0
      description: Disputas abiertas de esta partida cuyo árbitro actual es quien llama (contador de «Tareas de máster» o aviso al sorteado)
    NuevaDisputa:
      type: object
      required: [tipo, texto]
      properties:
        tipo: { type: string, enum: [ELIMINACION, NEGATIVA], description: '`ELIMINACION` la abre la víctima; `NEGATIVA`, el cazador sobre su objetivo actual' }
        texto: { type: string, minLength: 1, maxLength: 280, example: 'No me pidió un boli, me pidió un lápiz.' }
    TextoDisputa:
      type: object
      required: [texto]
      properties:
        texto: { type: string, minLength: 1, maxLength: 280, example: Le pedí un boli en la biblioteca y me lo dejó. }
    DecisionDisputa:
      type: object
      required: [razon]
      properties:
        razon: { type: string, enum: [CAZADOR, VICTIMA], description: A quién da la razón el árbitro }
    Disputa:
      type: object
      required: [id, tipo, estado, aliasCazador, aliasVictima, mision, textoApertura, textoRespuesta, abiertaEn, plazoHasta, soyArbitro, puedoResponder, resultadoZona, razon, resueltaPor, cerradaEn]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [ELIMINACION, NEGATIVA] }
        estado: { type: string, enum: [ABIERTA, RESUELTA, SIN_OBJETO], description: '`SIN_OBJETO`: una disputa por negativa cuyo cazador ya no tiene a esa víctima, o una sobre una eliminación anulada en cadena' }
        aliasCazador: { type: [string, 'null'], description: Nulo si borró su cuenta («cuenta eliminada») }
        aliasVictima: { type: [string, 'null'], description: Nulo si borró su cuenta («cuenta eliminada») }
        mision: { type: string, example: Que te pida prestado un boli, description: 'La que cumplió el cazador (`ELIMINACION`) o su misión al abrirla (`NEGATIVA`)' }
        textoApertura: { type: string, description: 'La versión de quien abre: la víctima en `ELIMINACION`, el cazador en `NEGATIVA`' }
        textoRespuesta: { type: [string, 'null'], description: La versión del otro implicado; nula hasta que responde }
        abiertaEn: { type: string, format: date-time }
        plazoHasta: { type: string, format: date-time, description: 'Hasta cuándo puede decidir el árbitro actual; si vence, se sortea otro' }
        soyArbitro: { type: boolean }
        puedoResponder: { type: boolean, description: 'Quien llama es el otro implicado, no ha respondido y la disputa está abierta' }
        resultadoZona:
          type: [string, 'null']
          enum: [DENTRO, FUERA, NO_CONCLUYENTE, null]
          description: Solo para el árbitro y en `ELIMINACION`; nulo para los implicados y en `NEGATIVA`
        razon: { type: [string, 'null'], enum: [CAZADOR, VICTIMA, null], description: Nula mientras no está resuelta }
        resueltaPor: { type: [string, 'null'], enum: [MASTER, SORTEADO, ZONA, null], description: '`ZONA`: anulada sola por un resultado `DENTRO`' }
        cerradaEn: { type: [string, 'null'], format: date-time }
    EntradaFeed:
      type: object
      required: [tipo, alias, ocurridoEn]
      properties:
        tipo: { type: string, enum: [ELIMINACION, ANULACION], description: '`ANULACION`, una por cada jugador que revive (PBI 11b). Los abandonos y expulsiones llegan con la PBI 12' }
        alias: { type: [string, 'null'], description: Alias del eliminado o del que revive; nulo si borró su cuenta («cuenta eliminada») }
        ocurridoEn: { type: string, format: date-time }
    NuevaInscripcion:
      type: object
      required: [codigo, aceptaNormas]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoInvitacion' }
        aceptaNormas: { type: boolean, description: Tiene que ser true }
    Inscripcion:
      type: object
      required: [id, partidaId, inscritaEn, horario]
      properties:
        id: { type: string, format: uuid }
        partidaId: { type: string, format: uuid }
        inscritaEn: { type: string, format: date-time }
        horario: { $ref: '#/components/schemas/Horario' }
    Inscrito:
      type: object
      required: [id, alias, esMaster, estado]
      properties:
        id: { type: string, format: uuid, description: 'Id de la inscripción: clave de la lista y de expulsar (PBI 4)' }
        alias: { type: [string, 'null'], description: Nulo si borró su cuenta («cuenta eliminada») }
        esMaster: { type: boolean }
        estado:
          type: string
          enum: [VIVO, ELIMINADO]
          description: 'Estado del jugador en la partida; VIVO mientras la partida no ha arrancado'
    CodigoInvitacion:
      type: string
      pattern: '^[2-9A-HJKMNP-Z]{8}$'
      description: 8 caracteres sin 0, O, 1, I ni L
      example: K7PX4MQ2
    EstadoPartida:
      type: string
      enum: [EN_INSCRIPCION, EN_JUEGO, CANCELADA, CERRADA]
    ConfiguracionPartida:
      type: object
      required: [nombre, inicioEn, finEn, tipoMisiones, plazoDisputaHoras, entradasTardias, masterJuega]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 40 }
        inicioEn: { type: string, format: date-time, description: Al menos 15 min en el futuro }
        finEn: { type: string, format: date-time, description: Posterior a inicioEn }
        tipoMisiones: { type: string, enum: [BIBLIOTECA, IA] }
        plazoDisputaHoras: { type: integer, enum: [2, 6, 12, 24] }
        entradasTardias: { type: boolean }
        masterJuega: { type: boolean }
    CambiosPartida:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 3, maxLength: 40 }
        inicioEn: { type: string, format: date-time }
        finEn: { type: string, format: date-time }
        tipoMisiones: { type: string, enum: [BIBLIOTECA, IA] }
        plazoDisputaHoras: { type: integer, enum: [2, 6, 12, 24] }
        entradasTardias: { type: boolean }
        masterJuega: { type: boolean }
    Partida:
      description: Vista del máster
      allOf:
        - $ref: '#/components/schemas/ConfiguracionPartida'
        - type: object
          required: [id, estado, codigoInvitacion, enlace, numInscritos, creadaEn, resultado, disputasPorArbitrar]
          properties:
            id: { type: string, format: uuid }
            estado: { $ref: '#/components/schemas/EstadoPartida' }
            codigoInvitacion: { $ref: '#/components/schemas/CodigoInvitacion' }
            enlace: { type: string, example: 'ghostmark://unirse/K7PX4MQ2', description: Lo que contiene el QR }
            numInscritos: { type: integer, minimum: 0 }
            creadaEn: { type: string, format: date-time }
            resultado: { $ref: '#/components/schemas/ResultadoPartida' }
            disputasPorArbitrar: { $ref: '#/components/schemas/DisputasPorArbitrar' }
    PartidaResumen:
      description: Tarjeta de la pestaña «Partidas»
      type: object
      required: [id, nombre, estado, inicioEn, finEn, soyMaster, soyJugador, numInscritos, motivoCancelacion, resultado, disputasPorArbitrar]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPartida' }
        inicioEn: { type: string, format: date-time }
        finEn: { type: string, format: date-time }
        soyMaster: { type: boolean }
        soyJugador: { type: boolean, description: La cuenta tiene inscripción en la partida; falso para el máster que no juega }
        numInscritos: { type: integer, minimum: 0 }
        motivoCancelacion:
          type: [string, 'null']
          enum: [POCOS_JUGADORES, MASTER_SIN_CUENTA, null]
          description: Solo en una partida `CANCELADA`, el motivo de su evento `PARTIDA_CANCELADA`; nulo en los demás estados
        resultado: { $ref: '#/components/schemas/ResultadoPartida' }
        disputasPorArbitrar: { $ref: '#/components/schemas/DisputasPorArbitrar' }
    ResultadoPartida:
      description: Solo en una partida `CERRADA`, el resultado de su evento `PARTIDA_CERRADA`; nulo en los demás estados
      type: [object, 'null']
      required: [tipo, motivo, aliasGanadores, eliminaciones, cerradaEn]
      properties:
        tipo: { type: string, enum: [SUPERVIVIENTE, GANADOR, EMPATE], description: '«X, último superviviente», «Gana X con N eliminaciones» o «Empate entre X e Y»' }
        motivo: { type: string, enum: [ULTIMO_SUPERVIVIENTE, FECHA_FIN, MASTER] }
        aliasGanadores:
          type: array
          minItems: 1
          items: { type: [string, 'null'], description: Nulo si borró su cuenta («cuenta eliminada») }
          description: Uno con `SUPERVIVIENTE` o `GANADOR`; dos o más con `EMPATE`
        eliminaciones: { type: integer, minimum: 0, description: Las del ganador o de cada empatado }
        cerradaEn: { type: string, format: date-time, description: Momento del cierre (el del evento `PARTIDA_CERRADA`) }
    PartidaPublica:
      description: Lo que ve quien abre el enlace antes de unirse
      type: object
      required: [nombre, estado, inicioEn, finEn, aliasMaster, numInscritos]
      properties:
        nombre: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPartida' }
        inicioEn: { type: string, format: date-time }
        finEn: { type: string, format: date-time }
        aliasMaster: { type: [string, 'null'], description: Nulo si el máster borró su cuenta }
        numInscritos: { type: integer, minimum: 0 }
    Alias:
      type: string
      pattern: '^[A-Za-z0-9_]{3,20}$'
      description: Único sin distinguir mayúsculas; letras sin tildes, números y guion bajo.
    Email:
      type: string
      format: email
      maxLength: 254
    Contrasena:
      type: string
      minLength: 8
      maxLength: 72
      writeOnly: true
    NuevaCuenta:
      type: object
      required: [alias, email, contrasena]
      properties:
        alias: { $ref: '#/components/schemas/Alias' }
        email: { $ref: '#/components/schemas/Email' }
        contrasena: { $ref: '#/components/schemas/Contrasena' }
    Credenciales:
      type: object
      required: [email, contrasena]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        contrasena: { $ref: '#/components/schemas/Contrasena' }
    TokenRefresco:
      type: object
      required: [tokenRefresco]
      properties:
        tokenRefresco: { type: string }
    Sesion:
      type: object
      required: [tokenAcceso, tokenRefresco, accesoCaducaEn, cuenta]
      properties:
        tokenAcceso: { type: string, description: JWT de 15 minutos }
        tokenRefresco: { type: string, description: 'Opaco, 30 días, un solo uso' }
        accesoCaducaEn: { type: string, format: date-time }
        cuenta: { $ref: '#/components/schemas/Cuenta' }
    Cuenta:
      type: object
      required: [id, alias, email, ubicacionAceptada, avisoDisponibilidadAceptado, creadaEn]
      properties:
        id: { type: string, format: uuid }
        alias: { $ref: '#/components/schemas/Alias' }
        email: { $ref: '#/components/schemas/Email' }
        ubicacionAceptada: { type: boolean }
        avisoDisponibilidadAceptado: { type: boolean }
        creadaEn: { type: string, format: date-time }
    Aceptaciones:
      type: object
      required: [ubicacion, avisoDisponibilidad]
      properties:
        ubicacion: { type: boolean, const: true }
        avisoDisponibilidad: { type: boolean, const: true }
    Franja:
      type: object
      required: [dia, horaInicio]
      properties:
        dia: { type: integer, minimum: 1, maximum: 5, description: 1 lunes … 5 viernes }
        horaInicio: { type: string, pattern: '^(0[89]|1[0-9]|20):(00|30)$', description: 'Inicio de la franja de 30 min, de 08:00 a 20:30' }
    Horario:
      type: object
      required: [franjas]
      properties:
        franjas:
          type: array
          maxItems: 130
          uniqueItems: true
          items: { $ref: '#/components/schemas/Franja' }
    Error:
      type: object
      required: [status, codigo]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          enum: [DATOS_NO_VALIDOS, ALIAS_OCUPADO, EMAIL_OCUPADO, CREDENCIALES_INCORRECTAS, NO_AUTENTICADO, TOKEN_NO_VALIDO, NO_ENCONTRADA, NO_ES_MASTER, PARTIDA_NO_EDITABLE, NORMAS_NO_ACEPTADAS, YA_INSCRITO, ES_MASTER, PARTIDA_NO_ABIERTA, POCOS_JUGADORES, PARTIDA_NO_EN_JUEGO, JUGADOR_ELIMINADO, CODIGO_INCORRECTO, CODIGO_CADUCADO, INTENTOS_BLOQUEADOS, HORARIO_LECTIVO, MISIONES_DE_BIBLIOTECA, LIMITE_TANDAS, MISION_YA_REVISADA, IA_NO_DISPONIBLE, DISPUTA_ABIERTA, DISPUTAS_PENDIENTES, ELIMINACION_NO_DISPUTABLE, PLAZO_DISPUTA_VENCIDO, DISPUTA_YA_ABIERTA, DISPUTA_NO_ABIERTA, YA_RESPONDIDA, NO_PUEDE_RESPONDER, NO_ES_ARBITRO]
        intentosRestantes: { type: integer, minimum: 1, maximum: 2, description: 'Solo en `CODIGO_INCORRECTO` y `CODIGO_CADUCADO`; nunca vale 0, porque el tercer fallo responde `INTENTOS_BLOQUEADOS`' }
        bloqueadoHasta: { type: string, format: date-time, description: Solo en `INTENTOS_BLOQUEADOS` }
        motivo: { type: string, enum: [CAZADOR, OBJETIVO], description: Solo en `HORARIO_LECTIVO` }
        disponibleEn: { type: string, format: date-time, description: Solo en `HORARIO_LECTIVO` }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
