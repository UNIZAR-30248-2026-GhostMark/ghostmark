<svg viewBox="0 0 800 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitectura de GhostMark: aplicación móvil, servidor con registro de eventos, base de datos y servicios externos">
  <defs>
    <marker id="fl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L7,3 z" fill="#6B2FA8"/>
    </marker>
  </defs>

  <g font-family="Lato, DejaVu Sans, sans-serif" fill="#1A0B2E" text-anchor="middle">

    <!-- Aplicación móvil -->
    <rect x="10" y="30" width="205" height="270" rx="10" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="112" y="54" font-size="16" font-weight="700">Aplicación móvil</text>
    <text x="112" y="72" font-size="11.5" fill="#5B4A75">React Native · Expo · TypeScript</text>

    <rect x="24" y="86" width="177" height="54" rx="7" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
    <text x="112" y="109" font-size="12.5" font-weight="700">Pantallas del jugador</text>
    <text x="112" y="125" font-size="12.5" font-weight="700">y del máster</text>

    <rect x="24" y="150" width="177" height="58" rx="7" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
    <text x="112" y="173" font-size="12.5" font-weight="700">Mapa de zonas seguras</text>
    <text x="112" y="191" font-size="12" fill="#5B4A75">OpenStreetMap en WebView</text>

    <rect x="24" y="218" width="177" height="72" rx="7" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
    <text x="112" y="240" font-size="12.5" font-weight="700">Comprobación de zona</text>
    <text x="112" y="257" font-size="12" fill="#5B4A75">GPS y turf.js en el móvil</text>
    <text x="112" y="274" font-size="12" fill="#5B4A75" font-style="italic">la posición no sale de aquí</text>

    <!-- Servidor -->
    <rect x="285" y="30" width="330" height="270" rx="10" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="450" y="54" font-size="16" font-weight="700">Servidor</text>
    <text x="450" y="72" font-size="11.5" fill="#5B4A75">Java 21 · Spring Boot</text>
    <text x="450" y="87" font-size="11.5" fill="#5B4A75">un servicio en un contenedor Docker</text>

    <g font-size="12.5" font-weight="700">
      <rect x="297" y="100" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="345" y="119">Cuentas</text>
      <rect x="402" y="100" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="450" y="119">Partidas</text>
      <rect x="507" y="100" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="555" y="119">Cadena</text>

      <rect x="297" y="134" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="345" y="153">Misiones</text>
      <rect x="402" y="134" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="450" y="153" font-size="12">Eliminaciones</text>
      <rect x="507" y="134" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="555" y="153">Disputas</text>

      <rect x="297" y="168" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="345" y="187">Avisos</text>
      <rect x="402" y="168" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="450" y="187">Plazos</text>
      <rect x="507" y="168" width="96" height="28" rx="6" fill="#F4F0F9" stroke="#6B2FA8" stroke-width="1.2"/>
      <text x="555" y="187">Cierre</text>
    </g>

    <rect x="297" y="220" width="306" height="64" rx="7" fill="#6B2FA8"/>
    <text x="450" y="244" font-size="13.5" font-weight="700" fill="#FFFFFF">Registro de eventos</text>
    <text x="450" y="263" font-size="12" fill="#EFE7FB">cada hecho de la partida, sin modificarse</text>

    <!-- Servicios del servidor -->
    <rect x="665" y="30" width="125" height="92" rx="10" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="727" y="54" font-size="14" font-weight="700">PostgreSQL</text>
    <text x="727" y="71" font-size="12.5" font-weight="700">con PostGIS</text>
    <text x="727" y="93" font-size="12" fill="#5B4A75">eventos, cuentas</text>
    <text x="727" y="108" font-size="12" fill="#5B4A75">y zonas seguras</text>

    <rect x="665" y="132" width="125" height="76" rx="10" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="727" y="154" font-size="13" font-weight="700">Servicio de IA</text>
    <text x="727" y="170" font-size="12.5" font-weight="700">externo</text>
    <text x="727" y="190" font-size="12" fill="#5B4A75">propone misiones</text>

    <rect x="665" y="218" width="125" height="82" rx="10" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="727" y="241" font-size="13" font-weight="700">Notificaciones</text>
    <text x="727" y="257" font-size="12.5" font-weight="700">push (Expo)</text>
    <text x="727" y="277" font-size="12" fill="#5B4A75">avisos al móvil</text>

    <!-- Servicios que usa el móvil -->
    <rect x="10" y="326" width="98" height="52" rx="8" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="59" y="348" font-size="13" font-weight="700">Google</text>
    <text x="59" y="366" font-size="11.5" fill="#5B4A75">inicio de sesión</text>

    <rect x="117" y="326" width="98" height="52" rx="8" fill="#FBF9FE" stroke="#6B2FA8" stroke-width="2"/>
    <text x="166" y="348" font-size="13" font-weight="700">Mapas</text>
    <text x="166" y="366" font-size="11.5" fill="#5B4A75">teselas del mapa</text>

    <!-- Etiquetas de los flujos -->
    <text x="250" y="118" font-size="12" font-weight="700">API REST</text>
    <text x="250" y="222" font-size="11.5" fill="#5B4A75">solo el</text>
    <text x="250" y="236" font-size="11.5" fill="#5B4A75">resultado</text>
  </g>

  <!-- Flujos -->
  <g fill="none" stroke="#6B2FA8" stroke-width="2">
    <line x1="219" y1="126" x2="281" y2="126" marker-end="url(#fl)"/>
    <line x1="281" y1="142" x2="219" y2="142" marker-end="url(#fl)"/>
    <line x1="219" y1="252" x2="281" y2="252" marker-end="url(#fl)"/>
    <line x1="619" y1="75" x2="661" y2="75" marker-end="url(#fl)"/>
    <line x1="619" y1="170" x2="661" y2="170" marker-end="url(#fl)"/>
    <line x1="619" y1="260" x2="661" y2="260" marker-end="url(#fl)"/>
    <line x1="59" y1="324" x2="59" y2="303" marker-end="url(#fl)"/>
    <line x1="166" y1="324" x2="166" y2="303" marker-end="url(#fl)"/>
  </g>
</svg>
