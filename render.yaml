# Blueprint de Render (tarea 1.4, #37): servidor en Docker. La base de datos es un PostgreSQL
# gratuito de Neon (tarea #218), sin caducidad; PostGIS lo activa la migración
# V202610240900__postgis.sql. La conexión se configura en el panel del servicio:
# SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<base>?sslmode=require, con el host de la
# conexión directa de Neon (no el del pooler, para que Flyway migre sin problemas), y el
# usuario y la contraseña en DB_USER y DB_PASSWORD.
# Solo despliega el flujo despliegue-backend, con el deploy hook.
services:
  - type: web
    name: ghostmark-api
    runtime: docker
    plan: free
    autoDeploy: false
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRETO
        generateValue: true
      - key: GEMINI_CLAVE
        sync: false
      - key: GEMINI_MODELO
        sync: false
