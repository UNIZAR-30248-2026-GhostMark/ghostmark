name: test-sharing
on:
  pull_request:
  push:
    branches: [main, feature/50-compartir-qr]
permissions:
  contents: read
jobs:
  sharing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:sharing
      - run: node tests/session.test.cjs
