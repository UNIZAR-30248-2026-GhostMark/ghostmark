services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ghostmark
      POSTGRES_USER: ghostmark
      POSTGRES_PASSWORD: ghostmark
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostmark -d ghostmark"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ghostmark
      SPRING_DATASOURCE_USERNAME: ghostmark
      SPRING_DATASOURCE_PASSWORD: ghostmark
    depends_on:
      db:
        condition: service_healthy
